<header class="bg-white/95 backdrop-blur-md border-b border-slate-200/80 sticky top-0 z-40">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-3">
    <!-- Logo Izquierda -->
    <a href="/" class="flex items-center gap-2.5 group shrink-0">
      <div class="w-10 h-10 rounded-2xl bg-sky-600 flex items-center justify-center text-white shadow-md shadow-sky-500/20 group-hover:scale-105 transition">
        <i data-lucide="compass" class="w-5 h-5 text-cyan-200"></i>
      </div>
      <div>
        <span class="font-display font-extrabold text-xl text-slate-900 tracking-tight leading-tight block">
          Estoy en <span class="text-sky-600">Claro</span>
        </span>
        <span class="text-[10px] font-semibold text-slate-500 tracking-wider uppercase block">
          Claromecó & Dunamar
        </span>
      </div>
    </a>

    <!-- Desktop Navigation -->
    <nav class="hidden lg:flex items-center gap-1 text-xs font-semibold text-slate-600">
      <a href="/" class="nav-link px-3 py-2 rounded-xl hover:text-slate-900 hover:bg-slate-100 transition" data-nav="inicio">Inicio</a>
      <a href="/categorias/index.html" class="nav-link px-3 py-2 rounded-xl hover:text-slate-900 hover:bg-slate-100 transition" data-nav="categorias">Comercios</a>
      <a href="/promociones.html" class="nav-link px-3 py-2 rounded-xl hover:text-slate-900 hover:bg-slate-100 transition flex items-center gap-1.5" data-nav="promociones">
        <i data-lucide="tag" class="w-3.5 h-3.5 text-amber-500"></i>
        <span>Promos & Eventos</span>
      </a>
      <a href="/turismo.html" class="nav-link px-3 py-2 rounded-xl hover:text-slate-900 hover:bg-slate-100 transition" data-nav="turismo">Paseos</a>
    </nav>

    <!-- Right Action Buttons (Desktop: Sumá tu Comercio + Urgencias. Móvil: Solo Urgencias bien visible) -->
    <div class="flex items-center gap-2 sm:gap-2.5">
      <!-- Sumar comercio discreto (Solo en Desktop / Tablet) -->
      <button data-open-merchant class="hidden md:flex bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold px-3.5 py-2 rounded-xl transition items-center gap-1.5 cursor-pointer shadow-xs" title="Sumá tu comercio a la guía">
        <i data-lucide="store" class="w-3.5 h-3.5 text-cyan-300"></i>
        <span>Sumá tu Comercio</span>
      </button>

      <!-- Botón Rojo Urgencias con ícono (En Móvil y Desktop, visible y sin cortes) -->
      <button data-open-urgencias class="bg-rose-600 hover:bg-rose-700 active:scale-95 text-white text-xs font-extrabold px-3 py-2 sm:px-3.5 sm:py-2 rounded-xl transition flex items-center gap-1.5 cursor-pointer shadow-sm shadow-rose-600/30 shrink-0" title="Ver Teléfonos de Urgencia y Guardia">
        <i data-lucide="phone-call" class="w-4 h-4 text-rose-100 animate-pulse"></i>
        <span>Urgencias</span>
      </button>
    </div>
  </div>
</header>
